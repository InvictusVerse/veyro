<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for Monitor Only -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0A192F" flood-opacity="0.22" />
    </filter>

    <!-- Monitor Screen Base Gradient (Warm Peach/Gold -> Indigo -> Royal Blue) -->
    <linearGradient id="monScreenBase" x1="0%" y1="15%" x2="85%" y2="75%">
      <stop offset="0%" stop-color="#FFE4B5" />
      <stop offset="18%" stop-color="#FFB38A" />
      <stop offset="38%" stop-color="#6B78B4" />
      <stop offset="65%" stop-color="#1E62D0" />
      <stop offset="100%" stop-color="#0A45A6" />
    </linearGradient>

    <!-- Monitor Diagonal Swoop Gradient -->
    <linearGradient id="monDiagonalWave" x1="0%" y1="20%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#FFC299" stop-opacity="0.88" />
      <stop offset="48%" stop-color="#8AB8E6" stop-opacity="0.78" />
      <stop offset="78%" stop-color="#2B82F6" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0.98" />
    </linearGradient>

    <!-- Monitor Chin Dark Slate Gradient -->
    <linearGradient id="monChinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38495E" />
      <stop offset="50%" stop-color="#223042" />
      <stop offset="100%" stop-color="#121C29" />
    </linearGradient>

    <!-- Stand Neck Gradient -->
    <linearGradient id="standNeckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E2B" />
      <stop offset="55%" stop-color="#263547" />
      <stop offset="100%" stop-color="#1D2A3A" />
    </linearGradient>

    <!-- Stand Base Gradient -->
    <linearGradient id="standBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A5B70" />
      <stop offset="50%" stop-color="#2C3C50" />
      <stop offset="100%" stop-color="#3B4C61" />
    </linearGradient>

    <!-- Phone Bezel Outer Gradient -->
    <linearGradient id="phoneBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263547" />
      <stop offset="50%" stop-color="#172230" />
      <stop offset="100%" stop-color="#0F1722" />
    </linearGradient>

    <!-- Phone Screen Base Wallpaper Gradient -->
    <linearGradient id="phoneScreenGrad" x1="5%" y1="5%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#FFF0C2" />
      <stop offset="28%" stop-color="#FFCA99" />
      <stop offset="58%" stop-color="#63B3FF" />
      <stop offset="85%" stop-color="#1464F6" />
      <stop offset="100%" stop-color="#093BB5" />
    </linearGradient>

    <!-- Phone Bottom-Left Warm/Blue Fold -->
    <linearGradient id="phoneBottomGrad" x1="0%" y1="100%" x2="95%" y2="25%">
      <stop offset="0%" stop-color="#E57368" />
      <stop offset="28%" stop-color="#9A6B9E" />
      <stop offset="60%" stop-color="#1E69DE" />
      <stop offset="100%" stop-color="#0944B8" />
    </linearGradient>

    <!-- Translucent Sync Glass Ribbon Gradient -->
    <linearGradient id="syncGlassGrad" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78" />
      <stop offset="35%" stop-color="#D9ECFF" stop-opacity="0.65" />
      <stop offset="68%" stop-color="#FFE0C2" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#FFF5E6" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glassmorphic Card Overlay on Phone -->
    <linearGradient id="phoneGlassOverlay" x1="0%" y1="0%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="55%" stop-color="#FFE8D1" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#75B8FF" stop-opacity="0.22" />
    </linearGradient>

    <!-- Specular Edge Highlight Gradient -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B3D9FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    <!-- Monitor Full Silhouette Clip -->
    <clipPath id="monOuterClip">
      <rect x="123" y="218" width="700" height="492" rx="56" />
    </clipPath>

    <!-- Monitor Display Area Clip (Above Chin) -->
    <clipPath id="monScreenClip">
      <path d="M 179 218 H 767 A 56 56 0 0 1 823 274 V 632 H 123 V 274 A 56 56 0 0 1 179 218 Z" />
    </clipPath>

    <!-- Phone Display Area Clip: Uniform 22px bezel on all 4 sides + concentric rx="42" (64 - 22) -->
    <clipPath id="phoneScreenClip">
      <rect x="672" y="327" width="246" height="442" rx="42" />
    </clipPath>
  </defs>

  <!-- ==================== MONITOR STAND (Centered at X = 473) ==================== -->
  <g filter="url(#dropShadow)">
    <!-- Stand Neck -->
    <path d="M 411.5 700 L 534.5 700 L 534.5 718 C 534.5 745 553.5 756 567.5 762 L 378.5 762 C 392.5 756 411.5 745 411.5 718 Z" fill="url(#standNeckGrad)" />
    <!-- Neck Shadow Under Chin -->
    <rect x="411.5" y="700" width="123" height="12" fill="#0B121B" opacity="0.65" />
    <!-- Stand Base -->
    <rect x="324.5" y="753" width="297" height="40" rx="20" fill="url(#standBaseGrad)" />
    <!-- Stand Base Top Specular Rim -->
    <path d="M 344.5 754.5 H 601.5" stroke="#8FA3B8" stroke-width="2" stroke-linecap="round" opacity="0.55" />
  </g>

  <!-- ==================== MONITOR BODY ==================== -->
  <g filter="url(#dropShadow)">
    <!-- Full Monitor Background -->
    <g clip-path="url(#monOuterClip)">
      <!-- Monitor Display Content -->
      <g clip-path="url(#monScreenClip)">
        <!-- Base Wallpaper -->
        <rect x="123" y="218" width="700" height="414" fill="url(#monScreenBase)" />

        <!-- Diagonal Sweeping Light Wave (Top-Left to Bottom-Right) -->
        <path d="M 123 263 C 290 385 465 480 714 605 L 714 632 L 123 632 Z" fill="url(#monDiagonalWave)" />

        <!-- Crisp Diagonal Wave Highlight Line -->
        <path d="M 123 263 C 290 385 465 480 714 605" fill="none" stroke="#FFF8EB" stroke-width="2.5" opacity="0.75" />

        <!-- Deep Blue Wave Shadow Accent at Bottom Left -->
        <path d="M 123 632 Q 265 628 360 515 L 550 632 Z" fill="#1049B8" opacity="0.65" />

        <!-- Translucent Sync Bridge (Monitor Half) -->
        <path d="M 212 632 C 295 622 338 545 386 482 C 415 444 452 426 502 426 L 672 426 L 672 620 C 600 622 500 632 212 632 Z" fill="url(#syncGlassGrad)" />

        <!-- Sync Bridge Re-intersection Highlight (Golden-Orange Glow) -->
        <path d="M 412 456 C 495 504 575 548 672 588 L 672 632 L 320 632 C 355 585 382 495 412 456 Z" fill="url(#monDiagonalWave)" opacity="0.85" />

        <!-- Frosted Top Border of the Sync Bridge -->
        <path d="M 212 632 C 295 622 338 545 386 482 C 415 444 452 426 502 426 L 672 426" fill="none" stroke="url(#edgeHighlight)" stroke-width="2.5" />
      </g>

      <!-- Monitor Bottom Chin -->
      <rect x="123" y="632" width="700" height="78" fill="url(#monChinGrad)" />
      <!-- Chin Top Subtle Metallic Seam -->
      <line x1="123" y1="632.5" x2="823" y2="632.5" stroke="#5A708E" stroke-width="1.5" opacity="0.5" />
    </g>

    <!-- Monitor Outer Frame Subtle Inner Glow -->
    <rect x="124" y="219" width="698" height="490" rx="55" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25" />
  </g>

  <!-- ==================== SMARTPHONE (Uniform 22px Bezels & Concentric Radii) ==================== -->
  <!-- Phone Outer Bezel: X=650..940 (W=290), Y=305..791 (H=486), rx=64 -->
  <rect x="650" y="305" width="290" height="486" rx="64" fill="url(#phoneBezelGrad)" />
  <!-- Phone Outer Metallic Rim Highlight -->
  <rect x="651" y="306" width="288" height="484" rx="63" fill="none" stroke="#526882" stroke-width="2" opacity="0.65" />

  <!-- Phone Inner Screen: X=672..918 (W=246), Y=327..769 (H=442), rx=42 -->
  <g clip-path="url(#phoneScreenClip)">
    <!-- Base Phone Wallpaper (Warm Top-Left -> Bright Sky Blue) -->
    <rect x="672" y="327" width="246" height="442" fill="url(#phoneScreenGrad)" />

    <!-- Lower Wave Section (Coral/Peach Left -> Royal Blue Right) -->
    <path d="M 672 620 C 750 625 800 618 850 575 C 880 548 902 518 918 495 L 918 769 L 672 769 Z" fill="url(#phoneBottomGrad)" />

    <!-- Continuing Swoop Wave inside Phone Screen -->
    <path d="M 672 586 C 730 612 780 618 820 596 C 860 574 892 532 918 495 L 918 520 C 888 560 852 606 800 620 C 752 632 710 626 672 620 Z" fill="url(#syncGlassGrad)" opacity="0.9" />

    <!-- Crisp Swoop Rim Highlight inside Phone -->
    <path d="M 672 620 C 760 630 820 622 918 495" fill="none" stroke="#FFF5E6" stroke-width="2.5" opacity="0.85" />

    <!-- Glassmorphic Rounded Card Inside Phone (Right End of Sync Bridge) -->
    <path d="M 672 426 H 704 A 56 56 0 0 1 760 482 V 637 A 56 56 0 0 1 704 693 H 672 Z" fill="url(#phoneGlassOverlay)" />
    <path d="M 672 426 H 704 A 56 56 0 0 1 760 482 V 637 A 56 56 0 0 1 704 693 H 672" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.75" />

    <!-- Inner Screen Subtle Vignette Border -->
    <rect x="672" y="327" width="246" height="442" rx="42" fill="none" stroke="#0E1724" stroke-width="2" opacity="0.3" />
  </g>

  <!-- ==================== CONTINUOUS SYNC BRIDGE OVERLAY ==================== -->
  <!-- Bridges the exact 22px left bezel (X=650 to 672) -->
  <path d="M 650 426 H 672 V 693 H 650 Z" fill="#FFFFFF" opacity="0.18" />
  <line x1="650" y1="426" x2="672" y2="426" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
  <line x1="650" y1="693" x2="672" y2="693" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />

  <!-- Phone Earpiece / Dynamic Island Pill (Centered horizontally at X = 795) -->
  <rect x="761" y="347" width="68" height="20" rx="10" fill="#1C2B3E" />
  <rect x="761" y="347" width="68" height="20" rx="10" fill="none" stroke="#3A4E66" stroke-width="1" opacity="0.5" />
</svg>
