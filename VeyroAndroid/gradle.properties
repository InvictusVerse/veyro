# Veyro Android — Gradle properties
# See ProjectInfo/09-ENVIRONMENT.md for the full toolchain record.

# ── Memory / execution ─────────────────────────────────────────────────────────────────────
# These numbers are measured on this machine, not copied from a template. Getting them wrong
# does not slow the build down, it kills the daemon outright with
# "Failed to commit metaspace" (hs_err_pid*.log).
#
# The machine: 15.7 GB physical, i7-13650HX (20 cores), Windows 11.
# The constraint is the COMMIT LIMIT, not free RAM: the page file is fixed at 4-8 GB, so the
# system commit limit is ~19.7 GB with only ~5 GB free while WSA (~2.4 GB) and Memory
# Compression (~2.6 GB) are resident. A JVM that reserves 6 GB of heap plus 1 GB of metaspace
# cannot commit, and dies mid-build.
#
# 20 cores also works against us: ParallelGC sizes its thread pool from the core count, and
# every GC thread costs committed stack. Hence the explicit cap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -XX:ParallelGCThreads=2 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiles inside the Gradle daemon: one JVM instead of two. With this commit budget a
# second Kotlin daemon is the difference between a build and a crash.
kotlin.compiler.execution.strategy=in-process

# Serial module execution. 22 modules compiling concurrently is what exhausted the commit
# limit. Raise these two together, and only after freeing memory (closing WSA frees ~2.4 GB):
#   org.gradle.parallel=true
#   org.gradle.workers.max=3
org.gradle.parallel=false
org.gradle.workers.max=1

# Reuse task outputs across builds and branches.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Kotlin / Android ───────────────────────────────────────────────────────────────────────
kotlin.code.style=official
android.useAndroidX=true

# Only generate R classes for resources a module actually declares. Required for a clean
# multi-module build and significantly smaller R classes.
android.nonTransitiveRClass=true

# NOTE: android.defaults.buildfeatures.* are NOT set here. AGP 9 removed them and warns that
# they have no effect; buildConfig, aidl, renderscript and shaders are all off by default now.
# A module that wants BuildConfig must ask for it in its own buildFeatures block.
