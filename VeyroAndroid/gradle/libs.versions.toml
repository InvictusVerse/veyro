# ──────────────────────────────────────────────────────────────────────────────────────────
# Veyro Android — version catalog
#
# RULES (see AGENTS.md):
#   1. No version literal may appear in a module build file. Everything lives here.
#   2. Versions are pinned to what is already present in D:\CodingSoftwares\GradleCache
#      wherever possible, so a clean build downloads as little as possible (ADR-010).
#   3. Entries may be declared here before they are used by any module. An unused entry
#      costs nothing - it is not resolved and not downloaded.
# ──────────────────────────────────────────────────────────────────────────────────────────

[versions]
# ── Toolchain (cached) ─────────────────────────────────────────────────────────────────────
agp = "9.3.1"
kotlin = "2.4.20"

# ── AndroidX (cached) ──────────────────────────────────────────────────────────────────────
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
annotation = "1.11.0"
documentfile = "1.1.0"

# ── Kotlin ecosystem (cached) ──────────────────────────────────────────────────────────────
coroutines = "1.11.0"
serialization = "1.11.0"

# ── Crypto / IO ────────────────────────────────────────────────────────────────────────────
# BouncyCastle 1.79 is already cached; 1.86 is current. Upgrade deliberately (ADR-010).
bouncycastle = "1.79"
okio = "3.17.0"
# Only ktor-network (suspend TCP sockets) is used - not the HTTP client or server. ADR-014.
ktor = "3.5.2"

# ── Declared but NOT yet wired into any module ─────────────────────────────────────────────
# Pulled in during P3 (QR pairing) and P4 as needed. See ProjectInfo/06-ROADMAP.md.
zxing = "3.5.4"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"
work = "2.12.0"

# ── Testing ────────────────────────────────────────────────────────────────────────────────
junit4 = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
espresso = "3.7.0"
turbine = "1.2.1"
mockk = "1.14.11"
robolectric = "4.17"

[libraries]
# ── Gradle plugin artifacts, consumed by build-logic/convention only ───────────────────────
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

# ── AndroidX core ──────────────────────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# ── Lifecycle ──────────────────────────────────────────────────────────────────────────────
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

# ── Compose ────────────────────────────────────────────────────────────────────────────────
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The ~40-icon core set. NOT material-icons-extended: that one declares every Material icon as a
# Kotlin function and cost 50+ MB of dex in a measured debug build (see ADR-016).
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ── Kotlin ecosystem ───────────────────────────────────────────────────────────────────────
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# CBOR is the VLP control-message encoding (ProjectInfo/04-PROTOCOL.md §5.2). Wired in P3.
kotlinx-serialization-cbor = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-cbor", version.ref = "serialization" }

# ── Crypto / IO ────────────────────────────────────────────────────────────────────────────
bouncycastle-provider = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
# Suspend-based TCP server/client sockets with structured cancellation (ADR-014).
ktor-network = { group = "io.ktor", name = "ktor-network", version.ref = "ktor" }
# WebSocket link transport, ported from the Invox ecosystem code which is proven on these devices.
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }

# ── Declared, not yet used (P3/P4) ─────────────────────────────────────────────────────────
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# ── Testing ────────────────────────────────────────────────────────────────────────────────
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
lifecycle-compose = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# ── Veyro convention plugins (build-logic/convention) ──────────────────────────────────────
veyro-android-application = { id = "veyro.android.application" }
veyro-android-library = { id = "veyro.android.library" }
veyro-android-library-compose = { id = "veyro.android.library.compose" }
veyro-android-feature = { id = "veyro.android.feature" }
veyro-jvm-library = { id = "veyro.jvm.library" }
